server:
  port: 8080

spring:
  application:
    name: railbound-portal-backend
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27018/railbound_portal?replicaSet=rs0
      auto-index-creation: true

# ---------------------------------------------------------------------------
# DEVELOPMENT DEFAULTS. Every secret below can (and in production MUST) be
# supplied through an environment variable. Use the "prod" profile
# (SPRING_PROFILES_ACTIVE=prod) to disable the mock gateway and mock login and
# to refuse to start unless real secrets are provided.
# ---------------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:railbound-tactical-jwt-secret-key-32-chars-minimum-battle-royale-portal}
    expiration-ms: 86400000 # 24 hours
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:svc_internal_railbound_secret_key_8829}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  auth:
    # /auth/mock-token lets the caller pick any identity and role. Development only.
    mock-token-enabled: ${AUTH_MOCK_TOKEN_ENABLED:true}
  nakama:
    # Same value as Nakama's session.encryption_key. Leave empty to disable /auth/nakama-login.
    session-encryption-key: ${NAKAMA_SESSION_ENCRYPTION_KEY:}
  payment:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:mock}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    reconcile-interval-ms: 60000
    mock:
      enabled: ${PAYMENT_MOCK_ENABLED:true}
      secret: ${MOCK_GATEWAY_SECRET:mock_webhook_secret_key_99182}
      checkout-base-url: ${GATEWAY_CHECKOUT_BASE_URL:http://localhost:3000/checkout/hosted-mock}
    payhere:
      enabled: ${PAYHERE_ENABLED:false}
      sandbox: ${PAYHERE_SANDBOX:true}
      merchant-id: ${PAYHERE_MERCHANT_ID:}
      merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
      # Must be a PUBLIC https URL that PayHere's servers can reach, e.g.
      # https://<your-tunnel>/api/v1/payments/webhooks/payhere
      notify-url: ${PAYHERE_NOTIFY_URL:}

logging:
  level:
    root: INFO
    com.railbound.portal: DEBUG
    org.springframework.data.mongodb: INFO
  file:
    name: ${LOG_FILE:D:/MyProjects/railbound-asset-portal/local-logs/backend.log}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
