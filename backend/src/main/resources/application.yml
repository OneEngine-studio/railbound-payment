server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: railbound-portal-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27018/railbound_portal?replicaSet=rs0}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:railbound-tactical-jwt-secret-key-32-chars-minimum-battle-royale-portal}
    expiration-ms: 86400000 # 24 hours
  auth:
    # Demo login that mints a session for a Nakama user id. Must be false in any
    # public deployment; real players sign in through POST /auth/nakama.
    mock-login-enabled: ${APP_AUTH_MOCK_LOGIN_ENABLED:true}
  nakama:
    # Shared Nakama server key used to verify game session tokens (HS256).
    server-key: ${NAKAMA_SERVER_KEY:defaultkey}
    token-verification-enabled: ${NAKAMA_TOKEN_VERIFICATION_ENABLED:true}
    # Optional webhook that pushes live notifications to online Unity clients.
    notification-webhook-url: ${NAKAMA_NOTIFICATION_WEBHOOK_URL:}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:svc_internal_railbound_secret_key_8829}
  security:
    # Comma-separated origin patterns allowed to call the API. Add the deployed
    # portal origin (and any Unity WebGL origin) here. Never use "*" with
    # credentials in production.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:30}
      auth-burst: ${RATE_LIMIT_AUTH_BURST:15}
      checkout-per-minute: ${RATE_LIMIT_CHECKOUT_PER_MINUTE:30}
      checkout-burst: ${RATE_LIMIT_CHECKOUT_BURST:10}
      write-per-minute: ${RATE_LIMIT_WRITE_PER_MINUTE:120}
      write-burst: ${RATE_LIMIT_WRITE_BURST:40}
      # Single-node buckets. Use Redis for a multi-instance deployment.
  storage:
    # D-drive local media root for previews and content bundles.
    local-root: ${MEDIA_STORAGE_ROOT:local-data/media}
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:5242880}
    max-bundle-bytes: ${MEDIA_MAX_BUNDLE_BYTES:52428800}
  content:
    manifest-version: ${CONTENT_MANIFEST_VERSION:1.0.0}
  game:
    minimum-client-version: ${GAME_MINIMUM_CLIENT_VERSION:1.0.0}
  outbox:
    # Transactional outbox relay (player notifications + Nakama push).
    enabled: ${OUTBOX_ENABLED:true}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:15000}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:5000}
  payments:
    reconciliation:
      # Safety net for paid-but-unfulfilled and stale orders.
      enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
      initial-delay-ms: ${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:60000}
      interval-ms: ${PAYMENT_RECONCILIATION_INTERVAL_MS:900000}
  payment:
    # PayHere is the production/default provider. The mock adapter must never be
    # enabled in a real deployment.
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:payhere}
    # Public HTTPS origin that PayHere can reach for notify_url. For local
    # testing use a tunnel (Cloudflare Tunnel/ngrok) because localhost is not
    # reachable by PayHere.
    public-base-url: ${PAYMENT_PUBLIC_BASE_URL:http://localhost:8080}
    frontend-base-url: ${PAYMENT_FRONTEND_BASE_URL:http://localhost:3000}
    mock:
      enabled: ${APP_PAYMENT_MOCK_ENABLED:false}
      secret: ${MOCK_GATEWAY_SECRET:mock_webhook_secret_key_99182}
      checkout-base-url: ${GATEWAY_CHECKOUT_BASE_URL:http://localhost:3000/checkout/hosted-mock}
    payhere:
      # Checkout API credentials from PayHere Portal > Integrations.
      merchant-id: ${PAYHERE_MERCHANT_ID:}
      merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
      # Merchant API credentials from PayHere Portal > Settings > API Keys.
      # Only needed for reconciliation and refunds.
      app-id: ${PAYHERE_APP_ID:}
      app-secret: ${PAYHERE_APP_SECRET:}
      sandbox: ${PAYHERE_SANDBOX:true}
      currency: ${PAYHERE_CURRENCY:USD}
      live-checkout-url: https://www.payhere.lk/pay/checkout
      sandbox-checkout-url: https://sandbox.payhere.lk/pay/checkout
      live-api-base-url: https://www.payhere.lk
      sandbox-api-base-url: https://sandbox.payhere.lk
      connect-timeout-ms: 5000
      read-timeout-ms: 15000

logging:
  level:
    root: INFO
    com.railbound.portal: DEBUG
    org.springframework.data.mongodb: INFO
  file:
    name: D:/MyProjects/railbound-asset-portal/local-logs/backend.log

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
